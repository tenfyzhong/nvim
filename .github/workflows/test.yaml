name: Lua Tests
on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Lua
        uses: leafo/gh-actions-lua@v1.0.0
        with:
          luaVersion: "5.4" # You can specify a different Lua version if needed
      - name: Install LuaRocks
        run: |
          sudo apt-get update
          sudo apt-get install -y luarocks
      - name: Install LuaUnit
        run: luarocks install luaunit
      - name: Run tests
        run: make test
